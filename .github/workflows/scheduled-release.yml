name: Scheduled release

# Releases posts whose `publishAt` date has arrived: rebuilds the site every day
# and commits the result only if something real changed (not just timestamps).

on:
  schedule:
    - cron: '15 5 * * *' # 05:15 UTC, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Commit only real changes
        run: |
          if [ -z "$(git status --porcelain -- . ':(exclude)index.json' ':(exclude)sitemap.xml')" ]; then
            echo "Nothing to release today."
            exit 0
          fi
          git config user.name "cosy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Scheduled release: publish posts due today"
          git push
