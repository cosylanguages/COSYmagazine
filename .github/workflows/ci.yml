name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Validate posts and i18n dictionaries
        run: npm run validate
      - name: Verify build output is committed and current
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- . ':(exclude)index.json' ':(exclude)sitemap.xml')" ]; then
            echo "::error::Generated output is stale. Run 'npm run build' and commit the result."
            git status --porcelain -- . ':(exclude)index.json' ':(exclude)sitemap.xml'
            exit 1
          fi
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-js.js
      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test-e2e
