<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="notebook-handwritten" data-seed="top-10-verbs-ka" data-lang="ka">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#f59e0b" />
    
      <polygon points="267,409 224,576 93,565 3,452 96,338 243,284" fill="#832222" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="344,316 333,541 47,616 -303,460 -220,209 73,-140 265,94" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="314,412 -21,613 -21,134" fill="#832222" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="247,591 63,709 -64,624 69,469" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="539,238 494,300 434,340 366,259 361,156 423,149 523,162" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(0 296.5 333.5)">
        <rect x="107" y="215" width="379" height="237" rx="6" fill="#f59e0b" opacity="0.3" stroke="#832222" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(7 527.5 220.5)">
        <rect x="320" y="112" width="415" height="217" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#832222" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="972,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 992,157.5 972,0" fill="#FCF9F2" opacity="0.9" stroke="#832222" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(-1 283 38)" filter="url(#soft-shadow)">
      <rect x="223" y="26" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="223" y1="26" x2="223" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="343" y1="26" x2="343" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#832222" stroke-width="1.5" fill="none" opacity="0.7">
