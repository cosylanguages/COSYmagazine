        <rect class="cover-overlay-box" x="24" y="424" width="1152" height="182" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#832222" stroke-width="1.2" />
        <text x="54" y="462" fill="#832222" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ᲥᲐᲠᲗᲣᲚᲘ ᲔᲜᲘᲡ ᲡᲐᲮᲔᲚᲛᲫᲦᲕᲐᲜᲔᲚᲝ — ᲜᲐᲬᲘᲚᲘ 1 (ᲡᲣᲚ 2 ᲜᲐᲬᲘᲚᲘ) • Vol. 2026.08</text>
        <text x="54" y="500" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">10 ძირითადი ზმნა ქართულ</text>
<text x="54" y="536" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">ენაში დამწყებთათვის (A0–A1</text>
<text x="54" y="572" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">/ A2)</text>
