      <circle cx="40" cy="114" r="3" fill="#832222" opacity="0.5" />
      <circle cx="46" cy="97" r="3" fill="#faf7f2" opacity="0.5" />
    </g>
  
      
    <g class="cover-sketchy-underline">
      <path d="M 85 581 Q 188 581 291 582" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 95 584 Q 188 584 281 583" stroke="#832222" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
