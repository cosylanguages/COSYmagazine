      <path d="M 855 59 Q 855 71 867 71 Q 855 71 855 83 Q 855 71 843 71 Q 855 71 855 59 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 900 101 Q 900 109 908 109 Q 900 109 900 117 Q 900 109 892 109 Q 900 109 900 101 Z" stroke="#faf7f2" stroke-width="1" />
