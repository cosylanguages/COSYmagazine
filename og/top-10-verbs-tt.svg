      <polygon points="1253,6 1160,185 975,226 875,13 960,-216 1170,-103" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="293,152 188,335 36,306 -76,194 51,39 206,-16" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
