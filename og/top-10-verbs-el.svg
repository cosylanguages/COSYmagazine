        <text x="54" y="510" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Τα 10 Βασικά Ρήματα στην</text>
<text x="54" y="542" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Ελληνική Γλώσσα για Αρχάριους</text>
<text x="54" y="574" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">(A0–A1 / A2)</text>
