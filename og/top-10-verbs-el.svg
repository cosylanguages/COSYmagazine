      <polygon points="1080,52 980,182 794,234 687,125 659,-43 797,-139 1003,-99" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1344,411 1204,549 1062,571 935,383 1029,260 1274,264" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(-8 505.5 292.5)">
