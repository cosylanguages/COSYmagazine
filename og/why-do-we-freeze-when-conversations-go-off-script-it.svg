<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="notebook-handwritten" data-seed="off-script-mindset" data-lang="it">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#d69e2e" />
    
      <polygon points="870,361 753,535 475,515 483,203 763,151" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="268,433 134,531 144,386" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1149,382 977,574 839,591 697,510 663,263 789,197 966,234" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1424,614 985,880 925,271" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="198,294 62,448 -85,314 97,153" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="952,518 837,738 600,499 795,324" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="985,210 826,488 400,354 486,32 799,-39" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="97,171 14,260 -55,167 19,91" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(-3 478.5 252.5)">
        <rect x="323" y="98" width="311" height="309" rx="6" fill="#d69e2e" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-7 811 249)">
        <rect x="579" y="91" width="464" height="316" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="971,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 991,157.5 971,0" fill="#FCF9F2" opacity="0.9" stroke="#3A6332" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(-4 628 41)" filter="url(#soft-shadow)">
      <rect x="568" y="29" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="568" y1="29" x2="568" y2="53" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="688" y1="29" x2="688" y2="53" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 870 45 Q 870 57 882 57 Q 870 57 870 69 Q 870 57 858 57 Q 870 57 870 45 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 915 87 Q 915 95 923 95 Q 915 95 915 103 Q 915 95 907 95 Q 915 95 915 87 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 80 135 C 90 120, 75 100, 95 85" />
      <circle cx="84" cy="120" r="3" fill="#3A6332" opacity="0.5" />
      <circle cx="90" cy="103" r="3" fill="#faf7f2" opacity="0.5" />
    </g>
  
      
    <g class="cover-sketchy-underline">
      <path d="M 44 598 Q 179 601 314 596" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 54 601 Q 179 604 304 600" stroke="#3A6332" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="228" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • COSYTALKS</text>
    </g>
  
      
      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="424" width="1152" height="182" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#3A6332" stroke-width="1.2" />
        <text x="54" y="462" fill="#3A6332" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">RIFLESSIONI • Vol. 2026.10</text>
        <text x="54" y="500" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Perché ci blocchiamo quando</text>
<text x="54" y="536" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">la conversazione esce dal</text>
<text x="54" y="572" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">copione?</text>
      </g>
    
      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>