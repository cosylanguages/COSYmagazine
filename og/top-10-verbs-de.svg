<text x="54" y="536" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">im Deutschen für Anfänger</text>
<text x="54" y="572" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">(A0–A1 / A2)</text>
