      <line x1="575" y1="30" x2="575" y2="54" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="695" y1="30" x2="695" y2="54" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
