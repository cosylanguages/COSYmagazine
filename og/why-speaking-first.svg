<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="why-speaking-first" data-lang="en">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#1e293b" />

      <polygon points="1241,411 1089,663 895,623 753,474 884,221 1153,218" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1150,310 1033,394 1021,253" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1145,101 887,261 852,-12" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="273,233 193,295 138,237 196,129" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1033,116 864,288 681,135 899,-65" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="883,401 860,707 488,641 272,391 491,18 792,239" fill="#225B58" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

  
      
      <g transform="rotate(-8 641.5 269)">
        <rect x="482" y="161" width="319" height="216" rx="6" fill="#1e293b" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-6 513 309.5)">
        <rect x="338" y="196" width="350" height="227" rx="6" fill="#1e293b" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-1 564 234)">
        <rect x="389" y="109" width="350" height="250" rx="6" fill="#1e293b" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-4 438.5 278)">
        <rect x="214" y="148" width="449" height="260" rx="6" fill="#fef3c7" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="992,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1012,157.5 992,0" fill="#FCF9F2" opacity="0.9" stroke="#225B58" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(8 869 46)" filter="url(#soft-shadow)">
      <rect x="809" y="34" width="120" height="24" rx="2" fill="#fef3c7" opacity="0.45" />
      <line x1="809" y1="34" x2="809" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="929" y1="34" x2="929" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#225B58" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 959 53 Q 959 65 971 65 Q 959 65 959 77 Q 959 65 947 65 Q 959 65 959 53 Z" fill="#fef3c7" opacity="0.3" />
      <path d="M 1004 95 Q 1004 103 1012 103 Q 1004 103 1004 111 Q 1004 103 996 103 Q 1004 103 1004 95 Z" stroke="#fef3c7" stroke-width="1" />
