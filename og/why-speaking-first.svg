      <path d="M 77 600 Q 194 596 310 599" stroke="#225B58" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="236" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#fef3c7" stroke-width="1.2" />
      <text x="34" y="40" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • FRONT PAGE</text>
    </g>
  
      
      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="460" width="1152" height="146" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#225B58" stroke-width="1.2" />
        <text x="54" y="498" fill="#225B58" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">EDITORIAL ROOM • Vol. 2026.08</text>
        <text x="54" y="536" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Why Speaking-First is the</text>
<text x="54" y="572" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Only Way to True Fluency</text>
      </g>
    
      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>