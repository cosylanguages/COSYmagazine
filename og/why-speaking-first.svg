      <path d="M 55 150 C 65 135, 50 115, 70 100" />
      <circle cx="59" cy="135" r="3" fill="#225B58" opacity="0.5" />
      <circle cx="65" cy="118" r="3" fill="#fef3c7" opacity="0.5" />
