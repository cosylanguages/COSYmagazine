      <polygon points="1335,125 1188,238 988,276 956,121 986,-34 1223,-53" fill="#633353" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="657,68 553,193 402,178 307,37 392,-56 529,-94" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="185,346 -141,566 -44,203" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
