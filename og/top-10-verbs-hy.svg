        <text x="54" y="462" fill="#633353" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ՀԱՅԵՐԵՆԻ ՈՒՂԵՑՈՒՅՑ — ՄԱՍ 1 (ԸՆԴՀԱՆՈՒՐ 2 ՄԱՍ) • Vol. 2026 — August Issue</text>
        <text x="54" y="500" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Հայերենի 10 հիմնական բայերը</text>
<text x="54" y="536" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">սկսնակների համար (A0–A1 /</text>
<text x="54" y="572" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">A2)</text>
