      <polygon points="667,153 636,182 586,194 548,175 539,123 602,61 646,86" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(7 586.5 382)">
