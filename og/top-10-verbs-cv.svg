        <text x="54" y="536" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Чăваш чĕлхинчи чи кирлĕ 10</text>
<text x="54" y="572" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">глагол (A0–A1 / A2)</text>
