<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="botanical-dark" data-seed="everybody-scream-phrasal-verbs" data-lang="en">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#f3f8ff" />

      <polygon points="760,42 718,115 622,76 654,9 711,-17" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1309,223 1269,404 1019,411 932,238 1018,45 1293,9" fill="#bedcff" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="669,17 435,310 46,103 441,-187" fill="#bedcff" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="749,119 607,277 393,259 458,-2 635,-56" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="840,272 802,341 712,319 669,294 674,213 717,149 773,191" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="433,88 83,319 82,-87" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="501,303 401,443 270,383 253,225 434,189" fill="#bedcff" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(1 304.5 225)">
        <rect x="148" y="83" width="313" height="284" rx="6" fill="#f3f8ff" opacity="0.3" stroke="#6fa6e0" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-3 748 318)">
        <rect x="576" y="208" width="344" height="220" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#6fa6e0" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(8 477.5 329)">
        <rect x="299" y="215" width="357" height="228" rx="6" fill="#bedcff" opacity="0.3" stroke="#6fa6e0" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="967,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 987,157.5 967,0" fill="#FCF9F2" opacity="0.9" stroke="#6fa6e0" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(7 731 44)" filter="url(#soft-shadow)">
      <rect x="671" y="32" width="120" height="24" rx="2" fill="#bedcff" opacity="0.45" />
      <line x1="671" y1="32" x2="671" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="791" y1="32" x2="791" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#6fa6e0" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 949 83 Q 949 95 961 95 Q 949 95 949 107 Q 949 95 937 95 Q 949 95 949 83 Z" fill="#bedcff" opacity="0.3" />
      <path d="M 994 125 Q 994 133 1002 133 Q 994 133 994 141 Q 994 133 986 133 Q 994 133 994 125 Z" stroke="#bedcff" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 41 130 C 51 115, 36 95, 56 80" />
      <circle cx="45" cy="115" r="3" fill="#6fa6e0" opacity="0.5" />
      <circle cx="51" cy="98" r="3" fill="#bedcff" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 47 596 Q 143 591 239 598" stroke="#bedcff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 57 599 Q 143 594 229 598" stroke="#6fa6e0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="292" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#bedcff" stroke-width="1.2" />
      <text x="34" y="40" fill="#2a5d9f" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • GRAMMAR MADE COSY</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#6fa6e0" stroke-width="1.2" />
        <text x="54" y="474" fill="#225B58" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">GRAMMAR MADE COSY • Vol. 2026 — December Issue</text>
        <text x="54" y="510" fill="#2a5d9f" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">The Secret Logic of Phrasal</text>
<text x="54" y="542" fill="#2a5d9f" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Verbs: How to Decode,</text>
<text x="54" y="574" fill="#2a5d9f" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Understand, and Create Them</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.18" pointer-events="none" />
    </svg>