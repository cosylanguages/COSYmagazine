    </g>
  
      
      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#274B7D" stroke-width="1.2" />
        <text x="54" y="474" fill="#274B7D" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ERREURS DU SAMEDI • ÉPISODE 1 • Vol. 2026.10</text>
        <text x="54" y="510" fill="#16a34a" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Erreurs du Samedi Épisode 1 : 5</text>
<text x="54" y="542" fill="#16a34a" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">erreurs courantes en français et</text>
<text x="54" y="574" fill="#16a34a" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">comment les corriger</text>
      </g>
    
      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>