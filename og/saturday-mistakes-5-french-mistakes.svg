<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="notebook-handwritten" data-seed="saturday-mistakes-fr" data-lang="fr">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#ca8a04" />
    
      <polygon points="1036,158 823,359 678,155 829,-11" fill="#274B7D" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1123,594 1115,652 1038,657 992,583 1018,530 1090,551" fill="#274B7D" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="647,467 337,632 366,344" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="285,401 232,451 135,499 61,441 85,355 125,275 229,304" fill="#274B7D" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1324,32 1133,249 899,262 849,-153 1142,-140" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(-9 563 232.5)">
        <rect x="327" y="115" width="472" height="235" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(1 344 357)">
        <rect x="111" y="207" width="466" height="300" rx="6" fill="#faf7f2" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(3 694.5 359.5)">
        <rect x="471" y="237" width="447" height="245" rx="6" fill="#274B7D" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="949,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 969,157.5 949,0" fill="#FCF9F2" opacity="0.9" stroke="#274B7D" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(-5 210 30)" filter="url(#soft-shadow)">
      <rect x="150" y="18" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="150" y1="18" x2="150" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="270" y1="18" x2="270" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#274B7D" stroke-width="1.5" fill="none" opacity="0.7">
