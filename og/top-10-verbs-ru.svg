      <line x1="323" y1="16" x2="323" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="443" y1="16" x2="443" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
