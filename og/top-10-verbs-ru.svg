<text x="54" y="542" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">языка для начинающих, часть 1</text>
<text x="54" y="574" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">(A0–A1 / A2)</text>
