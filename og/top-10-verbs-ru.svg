      <polygon points="701,422 491,583 510,293" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1072,543 890,678 854,421" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="651,205 92,559 223,-68" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(8 533 373.5)">
        <rect x="284" y="236" width="498" height="275" rx="6" fill="#fef3c7" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-7 618.5 239)">
        <rect x="417" y="91" width="403" height="296" rx="6" fill="#A03224" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
