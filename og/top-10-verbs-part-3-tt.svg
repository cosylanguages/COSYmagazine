      <path d="M 941 36 Q 941 48 953 48 Q 941 48 941 60 Q 941 48 929 48 Q 941 48 941 36 Z" fill="#ecfdf5" opacity="0.3" />
      <path d="M 986 78 Q 986 86 994 86 Q 986 86 986 94 Q 986 86 978 86 Q 986 86 986 78 Z" stroke="#ecfdf5" stroke-width="1" />
