        <rect class="cover-overlay-box" x="24" y="424" width="1152" height="182" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#1A6360" stroke-width="1.2" />
        <text x="54" y="462" fill="#1A6360" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">ТАТАР ТЕЛЕ ГИДЫ — 3 НЧЕ ӨЛЕШ • Vol. 2027.02</text>
        <text x="54" y="500" fill="#059669" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Татар теле буенча иң мөһим</text>
<text x="54" y="536" fill="#059669" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">10 фигыль, 3 нче өлеш</text>
<text x="54" y="572" fill="#059669" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">(A0–A1 / A2)</text>
      </g>
    
      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>