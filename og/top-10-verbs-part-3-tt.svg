      <path d="M 68 137 C 78 122, 63 102, 83 87" />
      <circle cx="72" cy="122" r="3" fill="#1A6360" opacity="0.5" />
      <circle cx="78" cy="105" r="3" fill="#ecfdf5" opacity="0.5" />
    </g>
  
      
    <g class="cover-sketchy-underline">
      <path d="M 97 577 Q 236 580 375 580" stroke="#ecfdf5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 107 580 Q 236 583 365 579" stroke="#1A6360" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
