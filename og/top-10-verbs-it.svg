      <line x1="754" y1="33" x2="754" y2="57" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
