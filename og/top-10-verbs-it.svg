      <path d="M 945 47 Q 945 59 957 59 Q 945 59 945 71 Q 945 59 933 59 Q 945 59 945 47 Z" fill="#fef3c7" opacity="0.3" />
      <path d="M 990 89 Q 990 97 998 97 Q 990 97 990 105 Q 990 97 982 97 Q 990 97 990 89 Z" stroke="#fef3c7" stroke-width="1" />
