      <polygon points="917,481 570,731 588,342" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="446,521 244,946 -138,794 0,411 209,293" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1415,255 1172,517 1002,281 1162,-6" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="159,101 75,210 -89,250 -108,122 -16,26 63,2" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="934,323 923,546 691,504 475,363 459,202 686,-11 826,127" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(3 459 368)">
