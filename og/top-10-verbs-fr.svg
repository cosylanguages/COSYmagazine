    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="993,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1013,157.5 993,0" fill="#FCF9F2" opacity="0.9" stroke="#274B7D" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(5 427 37)" filter="url(#soft-shadow)">
