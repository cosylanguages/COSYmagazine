      <polygon points="701,120 715,398 417,454 138,289 131,-22 439,-189 656,-178" fill="#fef3c7" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="322,487 40,730 34,321" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="85,255 62,323 -17,303 -39,248 -18,189 51,187" fill="#274B7D" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(-6 406 261)">
        <rect x="205" y="131" width="402" height="260" rx="6" fill="#1e293b" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
