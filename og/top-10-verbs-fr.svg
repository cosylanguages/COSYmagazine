        <text x="54" y="510" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Les 10 verbes essentiels en</text>
<text x="54" y="542" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">français pour débutants, partie</text>
<text x="54" y="574" fill="#d97706" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">1 (A0–A1 / A2)</text>
