<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="top-10-verbs-part-2-es" data-lang="es">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
