      <ellipse cx="1110" cy="14" rx="123" ry="70" fill="#faf7f2" opacity="0.15" transform="rotate(56 1110 14)" style="filter: blur(12px);" />
      <ellipse cx="1120" cy="9" rx="73.8" ry="42" fill="#A03224" opacity="0.12" transform="rotate(56 1110 14)" style="filter: blur(8px);" />
    
      <ellipse cx="143" cy="524" rx="198" ry="90" fill="#faf7f2" opacity="0.15" transform="rotate(282 143 524)" style="filter: blur(12px);" />
      <ellipse cx="153" cy="519" rx="118.8" ry="54" fill="#A03224" opacity="0.12" transform="rotate(282 143 524)" style="filter: blur(8px);" />
    
      <ellipse cx="465" cy="160" rx="113" ry="70" fill="#faf7f2" opacity="0.15" transform="rotate(227 465 160)" style="filter: blur(12px);" />
