    <g class="cover-sketchy-underline">
      <path d="M 87 584 Q 203 586 318 583" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 97 587 Q 203 589 308 586" stroke="#A03224" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="228" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • COSYTALKS</text>
    </g>
  
      
      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="424" width="1152" height="182" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#A03224" stroke-width="1.2" />
        <text x="54" y="462" fill="#A03224" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">РАЗМЫШЛЕНИЯ • Vol. 2026.10</text>
        <text x="54" y="500" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">Почему мы впадаем в ступор,</text>
<text x="54" y="536" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">когда разговор идёт не по</text>
<text x="54" y="572" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="27" font-weight="bold">сценарию?</text>
      </g>
    
      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>