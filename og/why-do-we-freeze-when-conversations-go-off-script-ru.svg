      <line x1="741" y1="34" x2="741" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="861" y1="34" x2="861" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#A03224" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 1061 49 Q 1061 61 1073 61 Q 1061 61 1061 73 Q 1061 61 1049 61 Q 1061 61 1061 49 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1106 91 Q 1106 99 1114 99 Q 1106 99 1106 107 Q 1106 99 1098 99 Q 1106 99 1106 91 Z" stroke="#faf7f2" stroke-width="1" />
