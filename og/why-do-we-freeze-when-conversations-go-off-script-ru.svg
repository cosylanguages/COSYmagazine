<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="notebook-handwritten" data-seed="off-script-mindset-ru" data-lang="ru">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#d69e2e" />
    
      <polygon points="516,101 456,301 168,295 158,135 221,-29 388,17" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="222,113 184,174 127,177 53,157 23,67 107,16 182,32" fill="#A03224" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="603,340 483,497 284,464 196,201 506,156" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="871,341 848,694 392,634 190,455 465,108 812,124" fill="#A03224" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1328,184 854,462 803,-228" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="391,630 317,773 151,743 88,608 134,459 339,425" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="642,400 503,580 211,652 23,465 146,214 326,26 602,69" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(-10 560.5 371)">
        <rect x="391" y="209" width="339" height="324" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-2 391.5 225.5)">
        <rect x="195" y="118" width="393" height="215" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(7 868.5 272)">
        <rect x="623" y="130" width="491" height="284" rx="6" fill="#A03224" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-10 331 412.5)">
        <rect x="162" y="263" width="338" height="299" rx="6" fill="#faf7f2" opacity="0.3" stroke="#A03224" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="1020,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1040,157.5 1020,0" fill="#FCF9F2" opacity="0.9" stroke="#A03224" stroke-width="0.8" stroke-dasharray="3 2" />
