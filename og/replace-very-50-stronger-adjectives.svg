      <ellipse cx="297" cy="0" rx="116" ry="105" fill="#faf7f2" opacity="0.15" transform="rotate(213 297 0)" style="filter: blur(12px);" />
      <ellipse cx="307" cy="-5" rx="69.6" ry="63" fill="#225B58" opacity="0.12" transform="rotate(213 297 0)" style="filter: blur(8px);" />
    
      <ellipse cx="249" cy="367" rx="156" ry="126" fill="#faf7f2" opacity="0.15" transform="rotate(343 249 367)" style="filter: blur(12px);" />
