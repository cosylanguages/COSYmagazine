      <ellipse cx="214" cy="505" rx="124" ry="86" fill="#faf7f2" opacity="0.15" transform="rotate(180 214 505)" style="filter: blur(12px);" />
      <ellipse cx="224" cy="500" rx="74.39999999999999" ry="51.6" fill="#225B58" opacity="0.12" transform="rotate(180 214 505)" style="filter: blur(8px);" />
    
      <ellipse cx="709" cy="597" rx="201" ry="86" fill="#faf7f2" opacity="0.15" transform="rotate(307 709 597)" style="filter: blur(12px);" />
      <ellipse cx="719" cy="592" rx="120.6" ry="51.6" fill="#225B58" opacity="0.12" transform="rotate(307 709 597)" style="filter: blur(8px);" />
    
      <ellipse cx="1173" cy="96" rx="177" ry="69" fill="#faf7f2" opacity="0.15" transform="rotate(92 1173 96)" style="filter: blur(12px);" />
      <ellipse cx="1183" cy="91" rx="106.2" ry="41.4" fill="#225B58" opacity="0.12" transform="rotate(92 1173 96)" style="filter: blur(8px);" />
    
      <ellipse cx="111" cy="178" rx="106" ry="126" fill="#faf7f2" opacity="0.15" transform="rotate(318 111 178)" style="filter: blur(12px);" />
      <ellipse cx="121" cy="173" rx="63.599999999999994" ry="75.6" fill="#225B58" opacity="0.12" transform="rotate(318 111 178)" style="filter: blur(8px);" />
    
  
      
      <g transform="rotate(-4 525 323.5)">
        <rect x="341" y="171" width="368" height="305" rx="6" fill="#faf7f2" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(-9 647 393.5)">
        <rect x="399" y="243" width="496" height="301" rx="6" fill="#225B58" opacity="0.3" stroke="#225B58" stroke-width="1" filter="url(#soft-shadow)" />
