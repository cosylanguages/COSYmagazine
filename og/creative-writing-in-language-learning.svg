    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="1012,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1032,157.5 1012,0" fill="#FCF9F2" opacity="0.9" stroke="#225B58" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(-3 957 46)" filter="url(#soft-shadow)">
      <rect x="897" y="34" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="897" y1="34" x2="897" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="1017" y1="34" x2="1017" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#225B58" stroke-width="1.5" fill="none" opacity="0.7">
