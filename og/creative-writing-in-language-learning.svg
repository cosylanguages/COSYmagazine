      <path d="M 1009 76 Q 1009 88 1021 88 Q 1009 88 1009 100 Q 1009 88 997 88 Q 1009 88 1009 76 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 1054 118 Q 1054 126 1062 126 Q 1054 126 1054 134 Q 1054 126 1046 126 Q 1054 126 1054 118 Z" stroke="#faf7f2" stroke-width="1" />
