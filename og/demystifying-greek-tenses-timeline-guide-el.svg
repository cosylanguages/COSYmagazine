<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="demystifying-greek-tenses-el" data-lang="el">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>
      
    <rect width="1200" height="630" fill="#e11d48" />
    
      <polygon points="1290,220 1173,381 936,389 942,79 1185,-5" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1161,377 879,570 816,155" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="221,304 196,414 112,386 63,367 31,290 114,214 166,262" fill="#236583" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="657,261 411,586 39,435 144,181 517,-49" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
      <polygon points="1152,188 1059,252 998,162 1067,88" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />
    
  
      
      <g transform="rotate(2 603.5 288.5)">
        <rect x="381" y="179" width="445" height="219" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      <g transform="rotate(9 399.5 326)">
        <rect x="181" y="160" width="437" height="332" rx="6" fill="#FFFFFF" opacity="0.3" stroke="#236583" stroke-width="1" filter="url(#soft-shadow)" />
      </g>
    
      
    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="985,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1005,157.5 985,0" fill="#FCF9F2" opacity="0.9" stroke="#236583" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>
  
      
    <g transform="rotate(0 146 40)" filter="url(#soft-shadow)">
      <rect x="86" y="28" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="86" y1="28" x2="86" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="206" y1="28" x2="206" y2="52" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#236583" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 886 63 Q 886 75 898 75 Q 886 75 886 87 Q 886 75 874 75 Q 886 75 886 63 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 931 105 Q 931 113 939 113 Q 931 113 931 121 Q 931 113 923 113 Q 931 113 931 105 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 80 131 C 90 116, 75 96, 95 81" />
      <circle cx="84" cy="116" r="3" fill="#236583" opacity="0.5" />
      <circle cx="90" cy="99" r="3" fill="#faf7f2" opacity="0.5" />
    </g>
  
      
    <g class="cover-sketchy-underline">
      <path d="M 59 576 Q 167 570 275 577" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 69 579 Q 167 573 265 578" stroke="#236583" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>
  
      
    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • GRAMMAR</text>
    </g>
  
      
      <g class="cover-text-overlay" filter="url(#soft-shadow)">
