      <line x1="997" y1="30" x2="997" y2="54" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="1117" y1="30" x2="1117" y2="54" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>
  
      
    <g class="cover-tiny-doodles" stroke="#B05322" stroke-width="1.5" fill="none" opacity="0.7">
