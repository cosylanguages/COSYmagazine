      <circle cx="65" cy="90" r="3" fill="#fef3c7" opacity="0.5" />
    </g>
  
      
    <g class="cover-sketchy-underline">
      <path d="M 74 590 Q 202 587 329 592" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 84 593 Q 202 590 319 592" stroke="#B05322" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
